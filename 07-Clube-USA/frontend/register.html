<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Clube USA</title>
  <style>
    :root { --primary: #1B4FBB; --accent: #F5A623; --bg: #F8F9FA; --text: #212529; --muted: #6C757D; --border: #DEE2E6; --error: #DC3545; --success: #198754; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--primary); color: #fff; padding: 14px 24px; }
    header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 1.2rem; }
    header a span { color: var(--accent); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 40px 36px; width: 100%; max-width: 440px; }
    h2 { font-size: 1.5rem; margin-bottom: 6px; color: var(--primary); }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; color: var(--text); background: #fff; transition: border-color .15s; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(27,79,187,.12); }
    .optional { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
    .btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity .15s; margin-top: 8px; }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg { padding: 12px 14px; border-radius: 6px; font-size: 0.9rem; margin-top: 16px; display: none; }
    .msg.success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .msg.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--muted); }
    .footer-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header><a href="/"><span>Clube</span> USA</a></header>
  <main>
    <div class="card">
      <h2>Criar conta</h2>
      <p class="subtitle">Grátis. Para brasileiros nos EUA.</p>

      <form id="form" novalidate>
        <div class="row">
          <div class="field">
            <label for="first_name">Nome</label>
            <input id="first_name" type="text" placeholder="João" required>
          </div>
          <div class="field">
            <label for="last_name">Sobrenome</label>
            <input id="last_name" type="text" placeholder="Silva" required>
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="joao@email.com" required>
        </div>

        <div class="field">
          <label for="password">Senha <span class="optional">(mín. 8 caracteres)</span></label>
          <input id="password" type="password" placeholder="••••••••" required>
        </div>

        <div class="field">
          <label for="confirm_password">Confirmar senha</label>
          <input id="confirm_password" type="password" placeholder="••••••••" required>
        </div>

        <div class="row">
          <div class="field">
            <label for="zip_code">ZIP Code <span class="optional">(opcional)</span></label>
            <input id="zip_code" type="text" placeholder="10001" maxlength="10">
          </div>
          <div class="field">
            <label for="phone">Telefone <span class="optional">(opcional)</span></label>
            <input id="phone" type="tel" placeholder="+1 (555) 000-0000">
          </div>
        </div>

        <button class="btn" type="submit" id="btn-submit">Criar conta</button>
        <div class="msg" id="msg"></div>
      </form>

      <p class="footer-link">Já tem conta? <a href="/login.html">Entrar</a></p>
    </div>
  </main>

  <script>
    const API = "/api/v1";

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-submit");
      const msg = document.getElementById("msg");

      const first_name = document.getElementById("first_name").value.trim();
      const last_name = document.getElementById("last_name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm_password").value;
      const zip_code = document.getElementById("zip_code").value.trim() || undefined;
      const phone = document.getElementById("phone").value.trim() || undefined;

      msg.style.display = "none";

      if (!first_name || !last_name || !email || !password) {
        showMsg("Preencha todos os campos obrigatórios.", "error");
        return;
      }
      if (password.length < 8) {
        showMsg("A senha deve ter no mínimo 8 caracteres.", "error");
        return;
      }
      if (password !== confirm) {
        showMsg("As senhas não conferem.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Cadastrando…";

      try {
        const body = { email, password, first_name, last_name };
        if (zip_code) body.zip_code = zip_code;
        if (phone) body.phone = phone;

        const res = await fetch(`${API}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        const data = await res.json();

        if (res.status === 201) {
          showMsg(data.message || "Cadastro realizado! Verifique seu email.", "success");
          document.getElementById("form").reset();
        } else {
          const detail = Array.isArray(data.detail)
            ? data.detail.map(d => d.msg).join("; ")
            : (data.detail || "Erro ao cadastrar. Tente novamente.");
          showMsg(detail, "error");
        }
      } catch (_) {
        showMsg("Erro de conexão. Verifique sua internet e tente novamente.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Criar conta";
      }
    });

    function showMsg(text, type) {
      const el = document.getElementById("msg");
      el.textContent = text;
      el.className = "msg " + type;
      el.style.display = "block";
    }
  </script>
</body>
</html>
