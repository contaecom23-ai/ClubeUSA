<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Clube USA</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Clube USA</h1>
      <p>Crie sua conta gratuita</p>
    </div>

    <form id="form">
      <div class="field">
        <label for="full_name">Nome completo</label>
        <input type="text" id="full_name" name="full_name" required autocomplete="name" placeholder="João Silva">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="joao@email.com">
      </div>
      <div class="field">
        <label for="password">Senha <small style="color:#6b7280">(mín. 8 caracteres)</small></label>
        <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" id="btn">Criar conta</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="links">
      Já tem conta? <a href="login.html">Entrar</a>
    </div>
  </div>

  <script>
    const API = (window.CLUBE_API_URL || 'http://localhost:8000');

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      msg.className = 'msg';

      btn.disabled = true;
      btn.textContent = 'Criando conta…';

      const body = {
        full_name: document.getElementById('full_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch(`${API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (res.ok) {
          msg.className = 'msg success show';
          msg.textContent = data.message;
          document.getElementById('form').reset();
        } else {
          const detail = Array.isArray(data.detail)
            ? data.detail.map(d => d.msg).join(' | ')
            : (data.detail || 'Erro ao criar conta');
          msg.className = 'msg error show';
          msg.textContent = detail;
        }
      } catch {
        msg.className = 'msg error show';
        msg.textContent = 'Erro de conexão. Verifique sua internet.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Criar conta';
      }
    });
  </script>
</body>
</html>
