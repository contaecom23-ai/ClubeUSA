<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — Clube USA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0f1e;
      color: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
    }
    .logo { font-size: 1.2rem; font-weight: 700; color: #4f9eff; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.4rem; }
    .subtitle { color: #9aaac0; font-size: 0.9rem; margin-bottom: 2rem; }
    label { display: block; font-size: 0.85rem; color: #c0cfe0; margin-bottom: 0.4rem; }
    input {
      width: 100%;
      background: #1a2233;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      color: #f0f4ff;
      font-size: 1rem;
      padding: 0.7rem 0.9rem;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 1.2rem;
    }
    input:focus { border-color: #4f9eff; }
    .btn-submit {
      width: 100%;
      background: #4f9eff;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.8rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-submit:hover { opacity: 0.85; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 7px;
      font-size: 0.9rem;
      display: none;
    }
    .msg.success { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .msg.error   { background: rgba(239,68,68,0.15);  color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: #9aaac0; }
    .footer-link a { color: #4f9eff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Clube USA 🇧🇷</div>
    <h1>Criar conta</h1>
    <p class="subtitle">Grátis. Sem cartão de crédito.</p>

    <form id="registerForm" novalidate>
      <label for="name">Nome completo</label>
      <input id="name" name="full_name" type="text" placeholder="João da Silva" required autocomplete="name" />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="joao@email.com" required autocomplete="email" />

      <label for="password">Senha <span style="color:#9aaac0;font-size:0.8rem">(mín. 8 caracteres, 1 número ou símbolo)</span></label>
      <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="new-password" />

      <button type="submit" class="btn-submit" id="submitBtn">Criar conta</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="footer-link">Já tem conta? <a href="login.html">Entrar</a></div>
  </div>

  <script>
    const API = '/api/v1';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');

      btn.disabled = true;
      btn.textContent = 'Criando...';
      msg.style.display = 'none';

      const body = {
        full_name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch(`${API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (res.ok) {
          msg.className = 'msg success';
          msg.textContent = data.message || 'Conta criada! Verifique seu email.';
          msg.style.display = 'block';
          document.getElementById('registerForm').reset();
        } else {
          const detail = Array.isArray(data.detail)
            ? data.detail.map(d => d.msg).join('. ')
            : (data.detail || 'Erro ao criar conta.');
          msg.className = 'msg error';
          msg.textContent = detail;
          msg.style.display = 'block';
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Erro de conexão. Tente novamente.';
        msg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Criar conta';
      }
    });
  </script>
</body>
</html>
