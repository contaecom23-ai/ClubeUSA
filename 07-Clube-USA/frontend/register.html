<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — Clube USA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #f8fafc; color: #1e293b; display: flex; min-height: 100vh;
           align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; border-radius: 16px; padding: 40px 36px;
            box-shadow: 0 4px 24px rgba(0,0,0,.08); width: 100%; max-width: 440px; }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo a { text-decoration: none; font-size: 1.6rem; font-weight: 800; color: #1d4ed8; }
    h1 { font-size: 1.5rem; margin-bottom: 24px; text-align: center; }
    .row { display: flex; gap: 12px; }
    .field { margin-bottom: 16px; flex: 1; }
    label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; color: #475569; }
    input { width: 100%; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px;
            font-size: 1rem; transition: border-color .15s; outline: none; }
    input:focus { border-color: #1d4ed8; }
    .btn { width: 100%; padding: 13px; background: #1d4ed8; color: #fff; border: none;
           border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer;
           transition: background .15s; margin-top: 8px; }
    .btn:hover { background: #1e40af; }
    .btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .msg { display: none; padding: 12px 16px; border-radius: 8px; margin-top: 16px;
           font-size: .9rem; text-align: center; }
    .msg.success { background: #dcfce7; color: #166534; display: block; }
    .msg.error   { background: #fee2e2; color: #991b1b; display: block; }
    .footer-link { text-align: center; margin-top: 20px; font-size: .9rem; color: #64748b; }
    .footer-link a { color: #1d4ed8; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><a href="/">🇧🇷 Clube USA</a></div>
    <h1>Criar conta gratuita</h1>

    <form id="form" novalidate>
      <div class="row">
        <div class="field">
          <label for="first_name">Nome</label>
          <input id="first_name" name="first_name" type="text" placeholder="Ana" required autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="last_name">Sobrenome</label>
          <input id="last_name" name="last_name" type="text" placeholder="Silva" required autocomplete="family-name" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="ana@exemplo.com" required autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Senha <span style="color:#94a3b8;font-weight:400">(mín. 8 caracteres)</span></label>
        <input id="password" name="password" type="password" required autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="zip_code">ZIP Code (opcional)</label>
        <input id="zip_code" name="zip_code" type="text" placeholder="10001" maxlength="10" autocomplete="postal-code" />
      </div>

      <button type="submit" class="btn" id="submit-btn">Criar conta</button>
    </form>

    <div class="msg" id="msg"></div>

    <p class="footer-link">Já tem conta? <a href="/login">Entrar</a></p>
  </div>

  <script>
    const form = document.getElementById('form');
    const msg  = document.getElementById('msg');
    const btn  = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Aguarde...';

      const body = {
        first_name: document.getElementById('first_name').value.trim(),
        last_name:  document.getElementById('last_name').value.trim(),
        email:      document.getElementById('email').value.trim(),
        password:   document.getElementById('password').value,
        zip_code:   document.getElementById('zip_code').value.trim() || undefined,
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (res.ok) {
          msg.className = 'msg success';
          msg.textContent = data.message;
          form.reset();
        } else {
          msg.className = 'msg error';
          msg.textContent = data.detail || 'Erro ao criar conta. Tente novamente.';
          btn.disabled = false;
          btn.textContent = 'Criar conta';
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Erro de conexão. Tente novamente.';
        btn.disabled = false;
        btn.textContent = 'Criar conta';
      }
    });
  </script>
</body>
</html>
