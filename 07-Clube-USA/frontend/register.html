<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastre-se — Clube USA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #f3f4f6; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 36px 32px;
            width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .logo { font-size: 22px; font-weight: 800; color: #1a56db; text-align: center;
            margin-bottom: 4px; }
    .tagline { text-align: center; color: #6b7280; font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 4px; }
    input { width: 100%; padding: 10px 12px; border: 1.5px solid #d1d5db;
            border-radius: 8px; font-size: 15px; outline: none; transition: border-color .15s; }
    input:focus { border-color: #1a56db; }
    .field { margin-bottom: 16px; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 3px; }
    .btn { width: 100%; padding: 12px; background: #1a56db; color: #fff;
           border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
           cursor: pointer; margin-top: 8px; transition: background .15s; }
    .btn:hover { background: #1648c8; }
    .btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .msg { text-align: center; padding: 12px; border-radius: 8px;
           font-size: 14px; margin-top: 16px; display: none; }
    .msg.success { background: #d1fae5; color: #065f46; }
    .msg.error   { background: #fee2e2; color: #991b1b; }
    .link { text-align: center; margin-top: 20px; font-size: 14px; color: #6b7280; }
    .link a { color: #1a56db; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Clube USA</div>
  <div class="tagline">Para imigrantes brasileiros nos EUA</div>

  <form id="form">
    <div class="field">
      <label for="name">Nome completo</label>
      <input type="text" id="name" placeholder="João Silva" required autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="joao@email.com" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
      <div class="hint">Mínimo 8 caracteres</div>
    </div>
    <div class="field">
      <label for="zip">ZIP Code (opcional)</label>
      <input type="text" id="zip" placeholder="10001" maxlength="10" autocomplete="postal-code">
      <div class="hint">Código postal americano</div>
    </div>
    <button type="submit" class="btn" id="btn">Criar conta grátis</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="link">Já tem conta? <a href="login.html">Entrar</a></div>
</div>

<script>
  const API = (window.CLUBE_USA_API || 'http://localhost:8000');

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = 'Criando conta...';
    msg.style.display = 'none';

    const body = {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
      full_name: document.getElementById('name').value.trim(),
    };
    const zip = document.getElementById('zip').value.trim();
    if (zip) body.zip_code = zip;

    try {
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (res.ok) {
        msg.className = 'msg success';
        msg.textContent = data.message || 'Conta criada! Verifique seu email.';
        document.getElementById('form').reset();
      } else {
        msg.className = 'msg error';
        const detail = data.detail;
        msg.textContent = typeof detail === 'string' ? detail
          : (Array.isArray(detail) ? detail.map(d => d.msg).join('; ') : 'Erro ao criar conta.');
      }
    } catch {
      msg.className = 'msg error';
      msg.textContent = 'Erro de conexão. Tente novamente.';
    }
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Criar conta grátis';
  });
</script>
</body>
</html>
