<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar email — Clube USA</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    .icon { font-size: 3rem; text-align: center; margin-bottom: 16px; }
    .card h2 { text-align: center; margin-bottom: 8px; }
    .card p  { text-align: center; color: #6b7280; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1><a href="/" style="color:inherit;text-decoration:none;">🇺🇸 Clube USA</a></h1>
    </div>

    <div class="card" id="card">
      <div id="icon" class="icon">⏳</div>
      <h2 id="title">Confirmando seu email…</h2>
      <p id="desc">Aguarde um momento.</p>
      <div id="action"></div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    async function run() {
      const params = new URLSearchParams(window.location.search);
      const token  = params.get("token");

      if (!token) {
        set("❌", "Link inválido", "Este link de confirmação não é válido.");
        return;
      }

      try {
        const resp = await api.confirmEmail(token);
        if (resp && resp.ok) {
          set(
            "✅",
            "Email confirmado!",
            "Sua conta está ativa. Faça login para começar.",
            '<a href="/login.html" class="btn btn-primary">Fazer login</a>'
          );
        } else {
          const msg = resp ? await apiError(resp) : "Erro de conexão.";
          set("❌", "Confirmação falhou", msg,
            '<a href="/cadastro.html" class="btn btn-secondary">Cadastrar novamente</a>');
        }
      } catch {
        set("❌", "Erro de conexão", "Não foi possível confirmar. Tente novamente.",
          '<button onclick="location.reload()" class="btn btn-secondary">Tentar novamente</button>');
      }
    }

    function set(icon, title, desc, action = "") {
      document.getElementById("icon").textContent  = icon;
      document.getElementById("title").textContent = title;
      document.getElementById("desc").textContent  = desc;
      document.getElementById("action").innerHTML  = action; // só inserimos HTML controlado
    }

    run();
  </script>
</body>
</html>
