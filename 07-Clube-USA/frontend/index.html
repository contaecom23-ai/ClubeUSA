<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clube USA — Sua comunidade brasileira nos EUA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0f1e;
      color: #f0f4ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo { font-size: 1.4rem; font-weight: 700; color: #4f9eff; }
    .nav-links { display: flex; gap: 1rem; }
    .btn {
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
    }
    .btn-outline { border: 1.5px solid #4f9eff; color: #4f9eff; background: transparent; }
    .btn-primary { background: #4f9eff; color: #fff; }
    .btn:hover { opacity: 0.85; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
    }
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.15; margin-bottom: 1.2rem; }
    h1 span { color: #4f9eff; }
    p.sub {
      font-size: 1.1rem;
      color: #9aaac0;
      max-width: 540px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    .cta-group { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .cta-group .btn { padding: 0.75rem 2rem; font-size: 1rem; }
    footer {
      text-align: center;
      padding: 1.5rem;
      color: #4a5568;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <nav>
    <span class="logo">Clube USA 🇧🇷</span>
    <div class="nav-links">
      <a href="login.html" class="btn btn-outline">Entrar</a>
      <a href="register.html" class="btn btn-primary">Criar conta</a>
    </div>
  </nav>
  <main>
    <h1>A vida nos EUA <span>mais organizada</span><br>para brasileiros</h1>
    <p class="sub">
      Promoções, empregos, moradia e serviços — tudo em um só lugar,
      na sua língua, para a sua comunidade.
    </p>
    <div class="cta-group">
      <a href="register.html" class="btn btn-primary">Criar conta grátis</a>
      <a href="login.html" class="btn btn-outline">Já tenho conta</a>
    </div>
  </main>
  <footer>© 2026 Clube USA. Feito com carinho para a comunidade brasileira.</footer>
</body>
</html>
