<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clube USA — A plataforma do imigrante brasileiro</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    .hero { text-align: center; padding: 48px 16px 32px; }
    .hero h1 { font-size: 2rem; font-weight: 900; color: #16a34a; margin-bottom: 12px; }
    .hero p  { color: #6b7280; font-size: 1.05rem; max-width: 340px; margin: 0 auto 32px; }
    .cta-row { display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 0 auto; }
  </style>
</head>
<body>
  <nav class="navbar">
    <span class="brand">🇺🇸 Clube USA</span>
    <a href="/login.html">Entrar</a>
  </nav>

  <section class="hero">
    <h1>Sua vida nos EUA,<br>mais organizada.</h1>
    <p>Promoções, empregos, moradia e muito mais — tudo para o imigrante brasileiro.</p>
    <div class="cta-row">
      <a href="/cadastro.html" class="btn btn-primary">Criar conta grátis</a>
      <a href="/login.html"   class="btn btn-secondary">Já tenho conta</a>
    </div>
  </section>

  <script src="/static/js/api.js"></script>
  <script>
    // Se já logado, redireciona para perfil
    if (auth.isLoggedIn()) window.location.href = "/perfil.html";
  </script>
</body>
</html>
