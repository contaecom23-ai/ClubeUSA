<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clube USA — Para Brasileiros nos EUA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb; color: #111827;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: #1d4ed8; color: #fff;
      padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header nav a {
      color: #bfdbfe; text-decoration: none; margin-left: 1.5rem; font-size: 0.9rem;
    }
    header nav a:hover { color: #fff; }
    main {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 4rem 1.5rem;
    }
    h2 { font-size: 2rem; color: #1d4ed8; margin-bottom: 1rem; }
    p.subtitle { font-size: 1.1rem; color: #6b7280; max-width: 560px; margin: 0 auto 2.5rem; line-height: 1.6; }
    .cta-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 0.75rem 2rem; border-radius: 8px; font-size: 1rem;
      font-weight: 600; text-decoration: none; cursor: pointer; border: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #1d4ed8; color: #fff; }
    .btn-secondary { background: #fff; color: #1d4ed8; border: 2px solid #1d4ed8; }
    footer { text-align: center; padding: 1.5rem; color: #9ca3af; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>🇧🇷 Clube USA</h1>
    <nav>
      <a href="/login.html">Entrar</a>
      <a href="/register.html">Cadastrar</a>
    </nav>
  </header>

  <main>
    <h2>A sua vida nos EUA, organizada.</h2>
    <p class="subtitle">
      Promoções, empregos, moradia, serviços — tudo em um só lugar,
      pensado para a comunidade brasileira nos Estados Unidos.
    </p>
    <div class="cta-buttons">
      <a href="/register.html" class="btn btn-primary">Criar conta grátis</a>
      <a href="/login.html" class="btn btn-secondary">Já tenho conta</a>
    </div>
  </main>

  <footer>
    &copy; 2026 Clube USA &mdash; todos os direitos reservados
  </footer>
</body>
</html>
