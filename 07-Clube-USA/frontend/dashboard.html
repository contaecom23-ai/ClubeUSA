<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clube USA — Meu Perfil</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb; color: #111827; min-height: 100vh;
    }
    header {
      background: #1d4ed8; color: #fff;
      padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header button {
      background: rgba(255,255,255,0.15); color: #fff; border: none;
      padding: 0.45rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.875rem;
      transition: background 0.15s;
    }
    header button:hover { background: rgba(255,255,255,0.25); }
    main { max-width: 640px; margin: 2.5rem auto; padding: 0 1rem; }
    .card {
      background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,0.08);
      padding: 2rem;
    }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: #1d4ed8; color: #fff; font-size: 1.8rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; margin-bottom: 1rem;
    }
    h2 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .email-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 999px;
      margin-bottom: 1.5rem;
    }
    .email-badge.confirmed { background: #d1fae5; color: #065f46; }
    .email-badge.unconfirmed { background: #fef9c3; color: #713f12; }
    .field-row {
      display: flex; gap: 0.5rem; align-items: baseline;
      padding: 0.6rem 0; border-bottom: 1px solid #f3f4f6;
    }
    .field-row:last-child { border-bottom: none; }
    .field-label { font-size: 0.8rem; color: #6b7280; width: 90px; flex-shrink: 0; }
    .field-value { font-size: 0.95rem; color: #111827; }
    .loader {
      text-align: center; padding: 3rem; color: #6b7280; font-size: 0.95rem;
    }
    .error-msg {
      background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 8px;
      font-size: 0.9rem;
    }
    .warning-msg {
      background: #fef9c3; color: #713f12; padding: 1rem; border-radius: 8px;
      font-size: 0.9rem; margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🇧🇷 Clube USA</h1>
    <button id="logoutBtn">Sair</button>
  </header>

  <main>
    <div class="card" id="card">
      <div class="loader" id="loader">Carregando perfil…</div>
    </div>
  </main>

  <script>
    const card = document.getElementById('card');
    const loader = document.getElementById('loader');

    function esc(str) {
      return document.createTextNode(str);
    }

    function setText(el, text) {
      el.textContent = text || '—';
    }

    async function loadProfile() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'same-origin' });

        if (res.status === 401) {
          window.location.href = '/login.html';
          return;
        }

        if (!res.ok) {
          loader.style.display = 'none';
          const err = document.createElement('div');
          err.className = 'error-msg';
          err.textContent = 'Erro ao carregar perfil. Tente recarregar a página.';
          card.appendChild(err);
          return;
        }

        const profile = await res.json();
        loader.remove();
        renderProfile(profile);
      } catch (_) {
        loader.textContent = 'Erro de conexão. Recarregue a página.';
      }
    }

    function renderProfile(p) {
      // Avatar com inicial do nome
      const initial = (p.full_name || '?')[0].toUpperCase();
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = initial;
      card.appendChild(avatar);

      const name = document.createElement('h2');
      name.textContent = p.full_name;
      card.appendChild(name);

      // Badge confirmação de email
      const badge = document.createElement('div');
      badge.className = 'email-badge ' + (p.email_confirmed ? 'confirmed' : 'unconfirmed');
      badge.textContent = p.email_confirmed ? '✓ Email confirmado' : '⚠ Email não confirmado';
      card.appendChild(badge);

      if (!p.email_confirmed) {
        const warn = document.createElement('div');
        warn.className = 'warning-msg';
        warn.textContent = 'Verifique sua caixa de email e clique no link de confirmação para ativar sua conta.';
        card.appendChild(warn);
      }

      const fields = [
        ['Email', p.email],
        ['Estado', p.us_state],
        ['Cidade', p.city],
      ];

      fields.forEach(([label, value]) => {
        const row = document.createElement('div');
        row.className = 'field-row';

        const lbl = document.createElement('span');
        lbl.className = 'field-label';
        lbl.textContent = label;

        const val = document.createElement('span');
        val.className = 'field-value';
        val.textContent = value || '—';

        row.appendChild(lbl);
        row.appendChild(val);
        card.appendChild(row);
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
      } finally {
        window.location.href = '/login.html';
      }
    });

    // Tenta renovar token silenciosamente se /me retornar 401
    // (flow: access_token expirado mas refresh_token ainda válido)
    async function fetchWithRefresh(url, opts) {
      let res = await fetch(url, opts);
      if (res.status === 401) {
        const refreshRes = await fetch('/api/auth/refresh', {
          method: 'POST',
          credentials: 'same-origin',
        });
        if (refreshRes.ok) {
          res = await fetch(url, opts);
        }
      }
      return res;
    }

    loadProfile();
  </script>
</body>
</html>
