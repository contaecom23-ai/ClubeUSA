<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clube USA — Confirmação de Email</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb; color: #111827;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem 1rem;
    }
    .card {
      background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,0.1);
      padding: 2.5rem 2rem; width: 100%; max-width: 400px; text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #6b7280; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block; padding: 0.75rem 2rem; background: #1d4ed8; color: #fff;
      border-radius: 8px; font-size: 1rem; font-weight: 600;
      text-decoration: none; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.87; }
    .loader {
      width: 36px; height: 36px; border: 4px solid #e5e7eb;
      border-top-color: #1d4ed8; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 1rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="loader" id="loader"></div>
    <p id="statusText">Confirmando seu email…</p>
  </div>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const tokenHash = params.get('token_hash');
      const type = params.get('type') || 'email';
      const card = document.getElementById('card');
      const loader = document.getElementById('loader');
      const statusText = document.getElementById('statusText');

      if (!tokenHash) {
        loader.style.display = 'none';
        card.innerHTML = `
          <div class="icon">⚠️</div>
          <h2>Link inválido</h2>
          <p>O link de confirmação é inválido ou já foi usado.</p>
          <a href="/register.html" class="btn">Criar nova conta</a>
        `;
        return;
      }

      try {
        const res = await fetch('/api/auth/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token_hash: tokenHash, type: type }),
        });

        loader.style.display = 'none';

        if (res.ok) {
          card.innerHTML = `
            <div class="icon">✅</div>
            <h2>Email confirmado!</h2>
            <p>Sua conta foi confirmada com sucesso. Você já pode fazer login.</p>
            <a href="/login.html" class="btn">Fazer login</a>
          `;
        } else {
          const data = await res.json().catch(() => ({}));
          const detail = typeof data.detail === 'string'
            ? data.detail
            : 'Token inválido ou expirado. Solicite um novo cadastro.';
          card.innerHTML = `
            <div class="icon">❌</div>
            <h2>Confirmação falhou</h2>
            <p>${escapeHtml(detail)}</p>
            <a href="/register.html" class="btn">Tentar novamente</a>
          `;
        }
      } catch (_) {
        loader.style.display = 'none';
        card.innerHTML = `
          <div class="icon">❌</div>
          <h2>Erro de conexão</h2>
          <p>Não foi possível confirmar o email. Verifique sua internet e tente novamente.</p>
          <a href="/" class="btn">Voltar ao início</a>
        `;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
    })();
  </script>
</body>
</html>
