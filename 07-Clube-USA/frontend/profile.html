<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil — Clube USA</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="card" style="max-width:520px;">
    <div class="profile-header">
      <div class="logo" style="text-align:left;margin-bottom:0;">
        <h1 style="font-size:22px;">Clube USA</h1>
      </div>
      <button class="btn-outline" id="btn-logout">Sair</button>
    </div>

    <div id="msg" class="msg"></div>

    <div id="profile-view" style="display:none;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
        <div>
          <div style="font-size:20px;font-weight:700;" id="view-name"></div>
          <div style="font-size:14px;color:#64748b;" id="view-email"></div>
          <span class="badge" id="view-badge" style="margin-top:4px;"></span>
        </div>
      </div>

      <div class="section-title">Localização</div>
      <div class="row" style="margin-bottom:8px;">
        <div>
          <div style="font-size:12px;color:#94a3b8;font-weight:600;">Estado</div>
          <div id="view-state" style="font-size:15px;margin-top:2px;">—</div>
        </div>
        <div>
          <div style="font-size:12px;color:#94a3b8;font-weight:600;">ZIP Code</div>
          <div id="view-zip" style="font-size:15px;margin-top:2px;">—</div>
        </div>
      </div>
      <div style="margin-bottom:8px;">
        <div style="font-size:12px;color:#94a3b8;font-weight:600;">Cidade</div>
        <div id="view-city" style="font-size:15px;margin-top:2px;">—</div>
      </div>
      <div style="margin-bottom:8px;">
        <div style="font-size:12px;color:#94a3b8;font-weight:600;">Telefone</div>
        <div id="view-phone" style="font-size:15px;margin-top:2px;">—</div>
      </div>

      <button class="btn btn-sm" id="btn-edit" style="margin-top:24px;">Editar perfil</button>
    </div>

    <div id="profile-form" style="display:none;">
      <h2 style="margin-bottom:20px;">Editar perfil</h2>

      <div id="form-msg" class="msg"></div>

      <form id="edit-form">
        <div class="field">
          <label for="full_name">Nome completo</label>
          <input type="text" id="full_name" name="full_name" required>
        </div>
        <div class="field">
          <label for="phone">Telefone</label>
          <input type="tel" id="phone" name="phone" placeholder="Ex: (305) 555-1234">
        </div>
        <div class="row">
          <div class="field">
            <label for="state_us">Estado (sigla)</label>
            <input type="text" id="state_us" name="state_us" placeholder="FL" maxlength="2" style="text-transform:uppercase;">
          </div>
          <div class="field">
            <label for="zip_code">ZIP Code</label>
            <input type="text" id="zip_code" name="zip_code" placeholder="33101" maxlength="5">
          </div>
        </div>
        <div class="field">
          <label for="city">Cidade</label>
          <input type="text" id="city" name="city" placeholder="Miami">
        </div>

        <div style="display:flex;gap:12px;margin-top:8px;">
          <button type="submit" class="btn" id="btn-save" style="flex:1;">Salvar</button>
          <button type="button" class="btn-outline" id="btn-cancel" style="flex:1;padding:13px;">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API = (window.CLUBE_USA_API || 'http://localhost:8000');

    function getToken() { return localStorage.getItem('cu_access_token'); }
    function getRefresh() { return localStorage.getItem('cu_refresh_token'); }

    function logout() {
      const rt = getRefresh();
      if (rt) {
        fetch(`${API}/auth/logout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: rt }),
        }).catch(() => {});
      }
      localStorage.removeItem('cu_access_token');
      localStorage.removeItem('cu_refresh_token');
      window.location.href = 'login.html';
    }

    async function apiFetch(path, opts = {}) {
      const token = getToken();
      if (!token) { window.location.href = 'login.html'; return null; }
      const res = await fetch(`${API}${path}`, {
        ...opts,
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
      if (res.status === 401) { logout(); return null; }
      return res;
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg show ' + type;
    }

    function clearMsg(id) { document.getElementById(id).className = 'msg'; }

    function renderProfile(p) {
      document.getElementById('view-name').textContent = p.full_name;
      document.getElementById('view-email').textContent = p.email;
      const badge = document.getElementById('view-badge');
      if (p.is_email_confirmed) {
        badge.textContent = '✓ Email confirmado';
        badge.className = 'badge confirmed';
      } else {
        badge.textContent = '⚠ Email não confirmado';
        badge.className = 'badge pending';
      }
      // Escapa conteúdo do usuário explicitamente (textContent já faz isso, mas expresso claramente)
      document.getElementById('view-state').textContent = p.state_us || '—';
      document.getElementById('view-zip').textContent   = p.zip_code || '—';
      document.getElementById('view-city').textContent  = p.city || '—';
      document.getElementById('view-phone').textContent = p.phone || '—';
    }

    function fillForm(p) {
      document.getElementById('full_name').value = p.full_name || '';
      document.getElementById('phone').value     = p.phone || '';
      document.getElementById('state_us').value  = p.state_us || '';
      document.getElementById('zip_code').value  = p.zip_code || '';
      document.getElementById('city').value      = p.city || '';
    }

    let currentProfile = null;

    async function loadProfile() {
      const res = await apiFetch('/users/me');
      if (!res) return;
      if (!res.ok) { showMsg('msg', 'Erro ao carregar perfil.', 'error'); return; }
      currentProfile = await res.json();
      renderProfile(currentProfile);
      document.getElementById('profile-view').style.display = 'block';
      document.getElementById('profile-form').style.display = 'none';
    }

    document.getElementById('btn-logout').addEventListener('click', logout);

    document.getElementById('btn-edit').addEventListener('click', () => {
      fillForm(currentProfile);
      document.getElementById('profile-view').style.display = 'none';
      document.getElementById('profile-form').style.display = 'block';
      clearMsg('form-msg');
    });

    document.getElementById('btn-cancel').addEventListener('click', () => {
      document.getElementById('profile-view').style.display = 'block';
      document.getElementById('profile-form').style.display = 'none';
    });

    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsg('form-msg');
      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      btn.textContent = 'Salvando...';

      const payload = {};
      const name    = document.getElementById('full_name').value.trim();
      const phone   = document.getElementById('phone').value.trim();
      const state   = document.getElementById('state_us').value.trim().toUpperCase();
      const zip     = document.getElementById('zip_code').value.trim();
      const city    = document.getElementById('city').value.trim();

      if (name)  payload.full_name = name;
      if (phone) payload.phone     = phone;
      if (state) payload.state_us  = state;
      if (zip)   payload.zip_code  = zip;
      if (city)  payload.city      = city;

      try {
        const res = await apiFetch('/users/me', { method: 'PATCH', body: JSON.stringify(payload) });
        if (!res) return;
        const data = await res.json();
        if (res.ok) {
          currentProfile = data;
          renderProfile(data);
          document.getElementById('profile-view').style.display = 'block';
          document.getElementById('profile-form').style.display = 'none';
          showMsg('msg', 'Perfil atualizado com sucesso!', 'success');
          setTimeout(() => clearMsg('msg'), 3000);
        } else {
          const detail = Array.isArray(data.detail)
            ? data.detail.map(e => e.msg).join('; ')
            : (data.detail || 'Erro ao salvar.');
          showMsg('form-msg', detail, 'error');
        }
      } catch {
        showMsg('form-msg', 'Erro de conexão. Tente novamente.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Salvar';
      }
    });

    // Redireciona se não logado
    if (!getToken()) {
      window.location.href = 'login.html';
    } else {
      loadProfile();
    }
  </script>
</body>
</html>
