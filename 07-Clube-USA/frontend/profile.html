<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clube USA — Meu Perfil</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2rem;
      width: 100%;
      max-width: 440px;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    h1 { font-size: 1.4rem; color: #1a202c; }
    .logout-btn {
      background: none;
      border: 1px solid #e2e8f0;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #718096;
      cursor: pointer;
    }
    .logout-btn:hover { background: #f7fafc; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin-bottom: 0.35rem; }
    input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }
    input:focus { border-color: #4c51bf; }
    input[readonly] { background: #f7fafc; color: #718096; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .btn {
      width: 100%;
      padding: 0.75rem;
      background: #4c51bf;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #434190; }
    .btn:disabled { background: #a0aec0; cursor: not-allowed; }
    .msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .msg.success { background: #c6f6d5; color: #276749; display: block; }
    .msg.error   { background: #fed7d7; color: #9b2c2c; display: block; }
    #loading { text-align: center; color: #718096; padding: 2rem 0; }
    #content { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>🇧🇷 Meu Perfil</h1>
      <button class="logout-btn" onclick="logout()">Sair</button>
    </div>

    <div id="loading">Carregando...</div>

    <div id="content">
      <form id="form">
        <div class="form-group">
          <label>Email</label>
          <input id="email" type="email" readonly>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="first_name">Nome</label>
            <input id="first_name" type="text" required>
          </div>
          <div class="form-group">
            <label for="last_name">Sobrenome</label>
            <input id="last_name" type="text" required>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="zip_code">ZIP Code</label>
            <input id="zip_code" type="text" required maxlength="10">
          </div>
          <div class="form-group">
            <label for="phone">Telefone</label>
            <input id="phone" type="tel" placeholder="Opcional">
          </div>
        </div>

        <button class="btn" type="submit" id="btn">Salvar alterações</button>
      </form>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
    const API = '';

    function getToken() {
      return localStorage.getItem('access_token');
    }

    async function authFetch(url, options = {}) {
      const token = getToken();
      if (!token) {
        window.location.href = 'login.html';
        return null;
      }
      const res = await fetch(url, {
        ...options,
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      });
      if (res.status === 401) {
        localStorage.clear();
        window.location.href = 'login.html';
        return null;
      }
      return res;
    }

    async function loadProfile() {
      try {
        const res = await authFetch(`${API}/users/me`);
        if (!res) return;
        if (!res.ok) throw new Error('Erro ao carregar perfil');
        const data = await res.json();
        document.getElementById('email').value     = data.email;
        document.getElementById('first_name').value = data.first_name;
        document.getElementById('last_name').value  = data.last_name;
        document.getElementById('zip_code').value   = data.zip_code;
        document.getElementById('phone').value      = data.phone || '';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch {
        document.getElementById('loading').textContent = 'Erro ao carregar perfil. Tente novamente.';
      }
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      msg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Salvando...';

      const body = {
        first_name: document.getElementById('first_name').value.trim(),
        last_name:  document.getElementById('last_name').value.trim(),
        zip_code:   document.getElementById('zip_code').value.trim(),
        phone:      document.getElementById('phone').value.trim() || null,
      };

      try {
        const res = await authFetch(`${API}/users/me`, {
          method: 'PATCH',
          body: JSON.stringify(body),
        });
        if (!res) return;
        if (res.ok) {
          msg.className = 'msg success';
          msg.textContent = 'Perfil atualizado com sucesso!';
        } else {
          const data = await res.json();
          msg.className = 'msg error';
          msg.textContent = data.detail || 'Erro ao salvar. Tente novamente.';
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Erro de conexão.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Salvar alterações';
      }
    });

    async function logout() {
      try {
        await authFetch(`${API}/auth/logout`, { method: 'POST' });
      } finally {
        localStorage.clear();
        window.location.href = 'login.html';
      }
    }

    loadProfile();
  </script>
</body>
</html>
