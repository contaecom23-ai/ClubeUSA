<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Perfil — Clube USA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0f1e; color: #f0f4ff;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo { font-size: 1.2rem; font-weight: 700; color: #4f9eff; }
    .btn-logout {
      background: transparent; border: 1.5px solid rgba(255,255,255,0.2);
      color: #c0cfe0; border-radius: 6px; padding: 0.45rem 1rem;
      font-size: 0.85rem; cursor: pointer;
    }
    .btn-logout:hover { border-color: #f87171; color: #f87171; }
    main { flex: 1; padding: 2rem 1.5rem; max-width: 640px; margin: 0 auto; width: 100%; }
    h1 { font-size: 1.6rem; margin-bottom: 0.4rem; }
    .email-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.82rem; padding: 0.25rem 0.75rem; border-radius: 20px;
      margin-bottom: 2rem;
    }
    .confirmed   { background: rgba(34,197,94,0.15); color: #4ade80; }
    .unconfirmed { background: rgba(239,68,68,0.15);  color: #f87171; }
    .section { margin-bottom: 2rem; }
    .section-title { font-size: 0.75rem; font-weight: 700; color: #4f9eff; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: #c0cfe0; margin-bottom: 0.35rem; }
    input, textarea {
      width: 100%; background: #1a2233;
      border: 1px solid rgba(255,255,255,0.12); border-radius: 7px;
      color: #f0f4ff; font-size: 0.95rem; padding: 0.65rem 0.9rem;
      outline: none; transition: border-color 0.15s; margin-bottom: 1rem;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 80px; }
    input:focus, textarea:focus { border-color: #4f9eff; }
    input[readonly] { opacity: 0.5; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
    .btn-save {
      background: #4f9eff; color: #fff; border: none; border-radius: 7px;
      font-size: 0.95rem; font-weight: 600; padding: 0.7rem 2rem;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn-save:hover { opacity: 0.85; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 1rem; padding: 0.7rem 1rem; border-radius: 7px;
      font-size: 0.88rem; display: none;
    }
    .msg.success { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .msg.error   { background: rgba(239,68,68,0.15);  color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    #loadingState { color: #9aaac0; padding: 3rem 0; text-align: center; }
  </style>
</head>
<body>
  <nav>
    <span class="logo">Clube USA 🇧🇷</span>
    <button class="btn-logout" id="logoutBtn">Sair</button>
  </nav>
  <main>
    <div id="loadingState">Carregando perfil...</div>
    <div id="profileContent" style="display:none">
      <h1 id="profileName">—</h1>
      <span class="email-badge" id="emailBadge"></span>

      <div class="section">
        <div class="section-title">Informações pessoais</div>
        <label for="fullName">Nome completo</label>
        <input id="fullName" type="text" />
        <label for="phone">Telefone</label>
        <input id="phone" type="tel" placeholder="(305) 555-0000" />
        <label for="bio">Bio (opcional)</label>
        <textarea id="bio" placeholder="Conte um pouco sobre você..."></textarea>
      </div>

      <div class="section">
        <div class="section-title">Localização</div>
        <div class="row">
          <div>
            <label for="zipCode">ZIP Code</label>
            <input id="zipCode" type="text" placeholder="33101" maxlength="10" />
          </div>
          <div>
            <label for="state">Estado</label>
            <input id="state" type="text" placeholder="FL" maxlength="2" />
          </div>
        </div>
        <label for="city">Cidade</label>
        <input id="city" type="text" placeholder="Miami" />
      </div>

      <button class="btn-save" id="saveBtn">Salvar alterações</button>
      <div class="msg" id="msg"></div>
    </div>
  </main>

  <script>
    const API = '/api/v1';

    function getToken() {
      return sessionStorage.getItem('access_token');
    }

    async function authFetch(url, opts = {}) {
      const token = getToken();
      if (!token) { window.location.href = 'login.html'; return null; }
      return fetch(url, {
        ...opts,
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
    }

    async function loadProfile() {
      const res = await authFetch(`${API}/profile/me`);
      if (!res) return;
      if (res.status === 401 || res.status === 403) { window.location.href = 'login.html'; return; }
      const data = await res.json();
      if (!res.ok) { document.getElementById('loadingState').textContent = 'Erro ao carregar perfil.'; return; }

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('profileContent').style.display = 'block';

      document.getElementById('profileName').textContent = data.full_name || 'Sem nome';
      const badge = document.getElementById('emailBadge');
      badge.textContent = data.email_confirmed ? `✓ ${data.email}` : `⚠ ${data.email} — não confirmado`;
      badge.className = `email-badge ${data.email_confirmed ? 'confirmed' : 'unconfirmed'}`;

      document.getElementById('fullName').value = data.full_name || '';
      document.getElementById('phone').value   = data.phone    || '';
      document.getElementById('bio').value     = data.bio      || '';
      document.getElementById('zipCode').value = data.zip_code || '';
      document.getElementById('state').value   = data.state    || '';
      document.getElementById('city').value    = data.city     || '';
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveBtn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = 'Salvando...';
      msg.style.display = 'none';

      const body = {};
      const fn = document.getElementById('fullName').value.trim();
      if (fn) body.full_name = fn;
      const phone = document.getElementById('phone').value.trim();
      if (phone) body.phone = phone;
      const bio = document.getElementById('bio').value.trim();
      if (bio) body.bio = bio;
      const zip = document.getElementById('zipCode').value.trim();
      if (zip) body.zip_code = zip;
      const state = document.getElementById('state').value.trim().toUpperCase();
      if (state) body.state = state;
      const city = document.getElementById('city').value.trim();
      if (city) body.city = city;

      try {
        const res = await authFetch(`${API}/profile/me`, { method: 'PATCH', body: JSON.stringify(body) });
        if (res.status === 401 || res.status === 403) { window.location.href = 'login.html'; return; }
        const data = await res.json();
        if (res.ok) {
          msg.className = 'msg success';
          msg.textContent = 'Perfil salvo com sucesso!';
          document.getElementById('profileName').textContent = data.full_name || 'Sem nome';
        } else {
          msg.className = 'msg error';
          msg.textContent = data.detail || 'Erro ao salvar.';
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Erro de conexão. Tente novamente.';
      } finally {
        msg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Salvar alterações';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      const refreshToken = sessionStorage.getItem('refresh_token');
      if (refreshToken) {
        try {
          await authFetch(`${API}/auth/logout`, { method: 'POST', body: JSON.stringify({ refresh_token: refreshToken }) });
        } catch { /* best-effort */ }
      }
      sessionStorage.clear();
      window.location.href = 'login.html';
    });

    loadProfile();
  </script>
</body>
</html>
