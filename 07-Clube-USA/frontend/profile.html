<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu perfil — Clube USA</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="card">
    <div class="profile-header">
      <div class="logo" style="margin-bottom:0;text-align:left;">
        <h1 style="font-size:1.25rem">Clube USA</h1>
      </div>
      <button class="btn btn-secondary" id="logout-btn" style="width:auto;margin-top:0;padding:.4rem .9rem;font-size:.85rem">
        Sair
      </button>
    </div>

    <h2>Meu perfil</h2>

    <div id="alert" class="alert"></div>
    <div id="loading" class="alert info visible">Carregando perfil…</div>

    <form id="profile-form" novalidate style="display:none">
      <div class="form-group">
        <label for="full_name">Nome completo</label>
        <input id="full_name" type="text" autocomplete="name" required>
        <div id="err-full_name" class="field-error"></div>
      </div>

      <div class="form-group">
        <label for="email">Email <span class="optional">(não editável)</span></label>
        <input id="email" type="email" disabled style="background:#f3f4f6;color:var(--color-text-muted);">
      </div>

      <div class="form-group">
        <label for="phone">
          Telefone <span class="optional">(opcional)</span>
        </label>
        <input id="phone" type="tel" placeholder="+1 305 555 1234" autocomplete="tel">
        <div id="err-phone" class="field-error"></div>
      </div>

      <div class="form-group">
        <label for="zip_code">
          ZIP code <span class="optional">(opcional)</span>
        </label>
        <input id="zip_code" type="text" placeholder="Ex: 33101" maxlength="10">
        <div id="err-zip_code" class="field-error"></div>
      </div>

      <div class="form-group">
        <label for="state">
          Estado <span class="optional">(opcional)</span>
        </label>
        <select id="state">
          <option value="">Selecione…</option>
          <option value="AL">Alabama</option>
          <option value="AK">Alaska</option>
          <option value="AZ">Arizona</option>
          <option value="AR">Arkansas</option>
          <option value="CA">California</option>
          <option value="CO">Colorado</option>
          <option value="CT">Connecticut</option>
          <option value="DE">Delaware</option>
          <option value="DC">District of Columbia</option>
          <option value="FL">Florida</option>
          <option value="GA">Georgia</option>
          <option value="HI">Hawaii</option>
          <option value="ID">Idaho</option>
          <option value="IL">Illinois</option>
          <option value="IN">Indiana</option>
          <option value="IA">Iowa</option>
          <option value="KS">Kansas</option>
          <option value="KY">Kentucky</option>
          <option value="LA">Louisiana</option>
          <option value="ME">Maine</option>
          <option value="MD">Maryland</option>
          <option value="MA">Massachusetts</option>
          <option value="MI">Michigan</option>
          <option value="MN">Minnesota</option>
          <option value="MS">Mississippi</option>
          <option value="MO">Missouri</option>
          <option value="MT">Montana</option>
          <option value="NE">Nebraska</option>
          <option value="NV">Nevada</option>
          <option value="NH">New Hampshire</option>
          <option value="NJ">New Jersey</option>
          <option value="NM">New Mexico</option>
          <option value="NY">New York</option>
          <option value="NC">North Carolina</option>
          <option value="ND">North Dakota</option>
          <option value="OH">Ohio</option>
          <option value="OK">Oklahoma</option>
          <option value="OR">Oregon</option>
          <option value="PA">Pennsylvania</option>
          <option value="RI">Rhode Island</option>
          <option value="SC">South Carolina</option>
          <option value="SD">South Dakota</option>
          <option value="TN">Tennessee</option>
          <option value="TX">Texas</option>
          <option value="UT">Utah</option>
          <option value="VT">Vermont</option>
          <option value="VA">Virginia</option>
          <option value="WA">Washington</option>
          <option value="WV">West Virginia</option>
          <option value="WI">Wisconsin</option>
          <option value="WY">Wyoming</option>
        </select>
        <div id="err-state" class="field-error"></div>
      </div>

      <button type="submit" class="btn" id="save-btn">Salvar alterações</button>
    </form>
  </div>

  <script>
    window.__SUPABASE_URL__     = "SUBSTITUIR_PELA_URL_DO_PROJETO";
    window.__SUPABASE_ANON_KEY__ = "SUBSTITUIR_PELA_ANON_KEY";
    window.__API_BASE__          = "http://localhost:8000";
  </script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    const alertEl   = document.getElementById("alert");
    const loadingEl = document.getElementById("loading");
    const formEl    = document.getElementById("profile-form");
    const saveBtn   = document.getElementById("save-btn");

    function showAlert(msg, type = "success") {
      alertEl.textContent = msg;
      alertEl.className = `alert ${type} visible`;
    }

    function fieldError(id, msg) {
      const el = document.getElementById("err-" + id);
      const input = document.getElementById(id);
      if (!el) return;
      if (msg) {
        el.textContent = msg;
        el.className = "field-error visible";
        if (input) input.classList.add("error");
      } else {
        el.className = "field-error";
        if (input) input.classList.remove("error");
      }
    }

    function fillForm(profile, email) {
      document.getElementById("full_name").value = profile.full_name || "";
      document.getElementById("email").value     = email || "";
      document.getElementById("phone").value     = profile.phone || "";
      document.getElementById("zip_code").value  = profile.zip_code || "";
      document.getElementById("state").value     = profile.state || "";
    }

    (async () => {
      const session = await requireAuth("/login.html");
      if (!session) return;

      try {
        const profile = await getProfile();
        loadingEl.style.display = "none";
        fillForm(profile, session.user.email);
        formEl.style.display = "block";
      } catch (err) {
        if (err.message.includes("404") || err.message.includes("não encontrado")) {
          // Perfil ainda não criado — mostra form vazio para o usuário preencher
          loadingEl.style.display = "none";
          document.getElementById("email").value = session.user.email || "";
          formEl.style.display = "block";
        } else {
          loadingEl.className = "alert error visible";
          loadingEl.textContent = "Erro ao carregar perfil: " + err.message;
        }
      }
    })();

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await signOut();
    });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertEl.className = "alert";
      ["full_name", "phone", "zip_code", "state"].forEach(id => fieldError(id, ""));

      const fullName = document.getElementById("full_name").value.trim();
      const phone    = document.getElementById("phone").value.trim() || null;
      const zipCode  = document.getElementById("zip_code").value.trim() || null;
      const state    = document.getElementById("state").value || null;

      if (!fullName || fullName.length < 2) {
        fieldError("full_name", "Nome deve ter ao menos 2 caracteres.");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerHTML = '<span class="spinner"></span>Salvando…';

      try {
        await updateProfile({ full_name: fullName, phone, zip_code: zipCode, state });
        showAlert("Perfil salvo com sucesso!", "success");
      } catch (err) {
        // Tenta extrair mensagens de validação do backend
        showAlert(err.message || "Erro ao salvar. Tente novamente.", "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Salvar alterações";
      }
    });
  </script>
</body>
</html>
