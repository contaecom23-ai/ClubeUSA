<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu perfil — Clube USA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #f8fafc; color: #1e293b; }
    nav { background: #1d4ed8; padding: 14px 24px; display: flex; align-items: center;
          justify-content: space-between; }
    nav a { color: #fff; text-decoration: none; font-weight: 800; font-size: 1.1rem; }
    nav button { background: rgba(255,255,255,.15); border: none; color: #fff; padding: 8px 18px;
                 border-radius: 6px; cursor: pointer; font-size: .9rem; font-weight: 600; }
    nav button:hover { background: rgba(255,255,255,.25); }
    main { max-width: 560px; margin: 48px auto; padding: 0 24px; }
    .loading { text-align: center; color: #64748b; margin-top: 80px; }
    .card { background: #fff; border-radius: 16px; padding: 36px;
            box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .avatar { width: 72px; height: 72px; border-radius: 50%; background: #1d4ed8;
              color: #fff; font-size: 2rem; display: flex; align-items: center;
              justify-content: center; margin: 0 auto 20px; }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 4px; }
    .email { text-align: center; color: #64748b; font-size: .9rem; margin-bottom: 28px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .78rem;
             font-weight: 700; margin-left: 6px; }
    .badge.confirmed { background: #dcfce7; color: #166534; }
    .badge.unconfirmed { background: #fee2e2; color: #991b1b; }
    h2 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; color: #475569; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 6px; color: #94a3b8; }
    input { width: 100%; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px;
            font-size: 1rem; transition: border-color .15s; outline: none; }
    input:focus { border-color: #1d4ed8; }
    .btn { padding: 11px 24px; background: #1d4ed8; color: #fff; border: none;
           border-radius: 8px; font-size: .95rem; font-weight: 700; cursor: pointer; }
    .btn:hover { background: #1e40af; }
    .btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .msg { display: none; padding: 10px 14px; border-radius: 8px; margin-top: 14px; font-size: .88rem; }
    .msg.success { background: #dcfce7; color: #166534; display: block; }
    .msg.error   { background: #fee2e2; color: #991b1b; display: block; }
    .divider { border: none; border-top: 1px solid #f1f5f9; margin: 28px 0; }
    .meta { font-size: .8rem; color: #94a3b8; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <nav>
    <a href="/">🇧🇷 Clube USA</a>
    <button id="logout-btn">Sair</button>
  </nav>

  <main>
    <div class="loading" id="loading">Carregando perfil...</div>
    <div class="card" id="card" style="display:none">
      <div class="avatar" id="avatar"></div>
      <h1 id="full-name"></h1>
      <p class="email" id="email-display"></p>

      <hr class="divider" />

      <h2>Editar perfil</h2>
      <form id="form" novalidate>
        <div style="display:flex;gap:12px">
          <div class="field" style="flex:1">
            <label for="first_name">Nome</label>
            <input id="first_name" type="text" />
          </div>
          <div class="field" style="flex:1">
            <label for="last_name">Sobrenome</label>
            <input id="last_name" type="text" />
          </div>
        </div>
        <div class="field">
          <label for="zip_code">ZIP Code</label>
          <input id="zip_code" type="text" placeholder="10001" maxlength="10" />
        </div>
        <button type="submit" class="btn" id="save-btn">Salvar alterações</button>
      </form>
      <div class="msg" id="msg"></div>

      <p class="meta" id="meta"></p>
    </div>
  </main>

  <script>
    const loading = document.getElementById('loading');
    const card    = document.getElementById('card');

    async function loadProfile() {
      try {
        const res  = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.status === 401) { window.location.href = '/login'; return; }
        const user = await res.json();

        document.getElementById('avatar').textContent =
          (user.first_name?.[0] || '?').toUpperCase();
        document.getElementById('full-name').innerHTML =
          `${user.first_name} ${user.last_name}`
          + `<span class="badge ${user.email_confirmed ? 'confirmed' : 'unconfirmed'}">`
          + (user.email_confirmed ? '✓ Email confirmado' : '✗ Email não confirmado')
          + '</span>';
        document.getElementById('email-display').textContent = user.email;
        document.getElementById('first_name').value = user.first_name || '';
        document.getElementById('last_name').value  = user.last_name  || '';
        document.getElementById('zip_code').value   = user.zip_code   || '';
        document.getElementById('meta').textContent =
          `Conta criada em: ${new Date(user.created_at).toLocaleDateString('pt-BR')}`;

        loading.style.display = 'none';
        card.style.display    = 'block';
      } catch {
        loading.textContent = 'Erro ao carregar perfil.';
      }
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg    = document.getElementById('msg');
      const btn    = document.getElementById('save-btn');
      msg.className = 'msg';
      btn.disabled  = true;
      btn.textContent = 'Salvando...';

      const body = {};
      const fn = document.getElementById('first_name').value.trim();
      const ln = document.getElementById('last_name').value.trim();
      const zp = document.getElementById('zip_code').value.trim();
      if (fn) body.first_name = fn;
      if (ln) body.last_name  = ln;
      if (zp) body.zip_code   = zp;

      try {
        const res  = await fetch('/api/auth/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(body),
        });
        const data = await res.json();
        msg.className = res.ok ? 'msg success' : 'msg error';
        msg.textContent = data.message || data.detail || '';
        if (res.ok) loadProfile();
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Erro de conexão.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Salvar alterações';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login';
    });

    loadProfile();
  </script>
</body>
</html>
