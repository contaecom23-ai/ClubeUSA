<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil — Clube USA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">Clube <span>USA</span> 🇧🇷</a>
  <div style="flex:1"></div>
  <button onclick="logout()" style="background:rgba(255,255,255,.15);color:#fff;
    border:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:14px;">
    Sair
  </button>
</nav>

<main class="page" style="align-items:flex-start;padding-top:32px;">
  <div style="width:100%;max-width:560px;margin:0 auto;padding:0 16px;">

    <div id="loading" style="text-align:center;padding:48px 0;">
      <div class="spinner" style="width:40px;height:40px;border-width:4px;
           border-color:rgba(26,86,219,.2);border-top-color:#1a56db;
           margin:0 auto 16px;"></div>
      <p style="color:#6b7280;">Carregando perfil…</p>
    </div>

    <div id="profileCard" class="card" style="display:none;">
      <h1 style="margin-bottom:4px;" id="userName"></h1>
      <p id="userEmail" style="color:#6b7280;font-size:15px;margin-bottom:20px;"></p>

      <div style="display:flex;gap:8px;margin-bottom:24px;" id="badgeRow"></div>

      <hr class="divider">
      <h2 style="font-size:16px;margin-bottom:16px;">Editar perfil</h2>

      <div id="editAlert" class="alert"></div>

      <form id="editForm" novalidate>
        <div class="form-group">
          <label for="edit_name">Nome completo</label>
          <input type="text" id="edit_name" name="full_name" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="edit_zip">CEP americano</label>
          <input type="text" id="edit_zip" name="zip_code"
                 placeholder="Ex: 10001" autocomplete="postal-code" maxlength="10">
          <p class="hint">Deixe em branco para remover.</p>
        </div>

        <button type="submit" class="btn btn-primary" id="saveBtn">
          Salvar alterações
        </button>
      </form>
    </div>

  </div>
</main>

<footer>© 2026 Clube USA</footer>

<script>
  const API_URL = 'http://localhost:8000'; // TODO: change to production URL

  const token = localStorage.getItem('access_token');
  if (!token) { window.location.href = 'login.html'; }

  async function loadProfile() {
    try {
      const resp = await fetch(`${API_URL}/profile/me`, {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (resp.status === 401) { logout(); return; }
      if (!resp.ok) { showGenericError(); return; }

      const user = await resp.json();
      renderProfile(user);
    } catch {
      showGenericError();
    }
  }

  function renderProfile(user) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('profileCard').style.display = 'block';
    document.getElementById('userName').textContent = user.full_name;
    document.getElementById('userEmail').textContent = user.email;
    document.getElementById('edit_name').value = user.full_name;
    document.getElementById('edit_zip').value = user.zip_code || '';

    const badgeRow = document.getElementById('badgeRow');
    if (user.email_confirmed) {
      badgeRow.innerHTML = '<span class="badge badge-confirmed">✓ Email confirmado</span>';
    } else {
      badgeRow.innerHTML = '<span class="badge badge-pending">⚠ Email pendente de confirmação</span>';
    }
  }

  function showGenericError() {
    document.getElementById('loading').innerHTML = `
      <p style="color:#c81e1e;">Erro ao carregar perfil. <a href="login.html">Tente novamente.</a></p>
    `;
  }

  const editForm = document.getElementById('editForm');
  const editAlert = document.getElementById('editAlert');
  const saveBtn = document.getElementById('saveBtn');

  function showEditAlert(msg, type) {
    editAlert.textContent = msg;
    editAlert.className = `alert alert-${type} show`;
    editAlert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  editForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    editAlert.className = 'alert';

    const full_name = document.getElementById('edit_name').value.trim();
    const zip_code = document.getElementById('edit_zip').value.trim() || null;

    if (!full_name) { showEditAlert('Nome não pode ser vazio.', 'error'); return; }

    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner"></span> Salvando…';

    try {
      const resp = await fetch(`${API_URL}/profile/me`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ full_name, zip_code }),
      });

      const data = await resp.json();

      if (resp.ok) {
        localStorage.setItem('user', JSON.stringify(data));
        renderProfile(data);
        showEditAlert('✅ Perfil atualizado com sucesso!', 'success');
      } else if (resp.status === 401) {
        logout();
      } else {
        showEditAlert(data.detail || 'Erro ao salvar. Tente novamente.', 'error');
      }
    } catch {
      showEditAlert('Erro de conexão. Tente novamente.', 'error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = 'Salvar alterações';
    }
  });

  function logout() {
    localStorage.removeItem('access_token');
    localStorage.removeItem('user');
    window.location.href = 'login.html';
  }

  loadProfile();
</script>
</body>
</html>
