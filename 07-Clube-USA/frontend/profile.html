<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil — Clube USA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #f3f4f6; min-height: 100vh; padding: 16px; }
    header { background: #1a56db; color: #fff; padding: 14px 20px;
             display: flex; justify-content: space-between; align-items: center;
             border-radius: 10px; margin-bottom: 24px; }
    header .logo { font-size: 18px; font-weight: 800; }
    header button { background: rgba(255,255,255,.2); border: none; color: #fff;
                    padding: 6px 14px; border-radius: 6px; cursor: pointer;
                    font-size: 14px; }
    header button:hover { background: rgba(255,255,255,.3); }
    .card { background: #fff; border-radius: 12px; padding: 28px 24px;
            max-width: 480px; margin: 0 auto; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 99px;
             font-size: 12px; font-weight: 600; margin-bottom: 20px; }
    .badge.confirmed { background: #d1fae5; color: #065f46; }
    .badge.unconfirmed { background: #fef3c7; color: #92400e; }
    h2 { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .email-text { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
    .section-title { font-size: 13px; font-weight: 600; color: #9ca3af;
                     text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
    label { display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 4px; }
    input { width: 100%; padding: 10px 12px; border: 1.5px solid #d1d5db;
            border-radius: 8px; font-size: 15px; outline: none; transition: border-color .15s; }
    input:focus { border-color: #1a56db; }
    .field { margin-bottom: 16px; }
    .btn { padding: 10px 22px; background: #1a56db; color: #fff;
           border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
           cursor: pointer; transition: background .15s; }
    .btn:hover { background: #1648c8; }
    .btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .msg { padding: 10px 14px; border-radius: 8px; font-size: 14px;
           margin-top: 12px; display: none; }
    .msg.success { background: #d1fae5; color: #065f46; }
    .msg.error   { background: #fee2e2; color: #991b1b; }
    .referral-box { background: #eff6ff; border: 1.5px solid #bfdbfe;
                    border-radius: 8px; padding: 14px 16px; margin-top: 24px; }
    .referral-label { font-size: 12px; font-weight: 600; color: #1e40af;
                      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .referral-code { font-size: 18px; font-weight: 700; color: #1a56db;
                     letter-spacing: 1px; }
    .referral-hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
    #loading { text-align: center; padding: 60px 0; color: #9ca3af; }
  </style>
</head>
<body>
<header>
  <span class="logo">Clube USA</span>
  <button id="logout-btn">Sair</button>
</header>

<div id="loading">Carregando perfil...</div>

<div class="card" id="profile-card" style="display:none">
  <div id="confirm-badge"></div>
  <h2 id="user-name"></h2>
  <div class="email-text" id="user-email"></div>

  <div class="section-title">Editar perfil</div>
  <form id="form">
    <div class="field">
      <label for="name">Nome completo</label>
      <input type="text" id="name" required>
    </div>
    <div class="field">
      <label for="zip">ZIP Code</label>
      <input type="text" id="zip" maxlength="10" placeholder="10001">
    </div>
    <button type="submit" class="btn" id="save-btn">Salvar alterações</button>
  </form>
  <div class="msg" id="msg"></div>

  <div class="referral-box">
    <div class="referral-label">Seu link de indicação</div>
    <div class="referral-code" id="referral-code"></div>
    <div class="referral-hint">Compartilhe para indicar amigos (programa de indicação em breve)</div>
  </div>
</div>

<script>
  const API = (window.CLUBE_USA_API || 'http://localhost:8000');
  const token = localStorage.getItem('clube_usa_token');

  if (!token) {
    window.location.href = 'login.html';
  }

  async function loadProfile() {
    const res = await fetch(`${API}/users/me`, {
      headers: { 'Authorization': `Bearer ${token}` },
    });
    if (res.status === 401) {
      localStorage.removeItem('clube_usa_token');
      window.location.href = 'login.html';
      return;
    }
    const user = await res.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('profile-card').style.display = 'block';
    document.getElementById('user-name').textContent = user.full_name;
    document.getElementById('user-email').textContent = user.email;
    document.getElementById('name').value = user.full_name;
    document.getElementById('zip').value = user.zip_code || '';
    document.getElementById('referral-code').textContent = user.referral_code;

    const badge = document.getElementById('confirm-badge');
    if (user.email_confirmed) {
      badge.innerHTML = '<span class="badge confirmed">✓ Email confirmado</span>';
    } else {
      badge.innerHTML = '<span class="badge unconfirmed">⚠️ Email não confirmado — verifique sua caixa de entrada</span>';
    }
  }

  loadProfile();

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('save-btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = 'Salvando...';
    msg.style.display = 'none';

    const body = {
      full_name: document.getElementById('name').value.trim() || null,
      zip_code: document.getElementById('zip').value.trim() || null,
    };

    try {
      const res = await fetch(`${API}/users/me`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (res.ok) {
        msg.className = 'msg success';
        msg.textContent = 'Perfil atualizado com sucesso!';
        document.getElementById('user-name').textContent = data.full_name;
      } else {
        msg.className = 'msg error';
        msg.textContent = data.detail || 'Erro ao salvar.';
      }
    } catch {
      msg.className = 'msg error';
      msg.textContent = 'Erro de conexão.';
    }
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Salvar alterações';
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('clube_usa_token');
    localStorage.removeItem('clube_usa_user');
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
