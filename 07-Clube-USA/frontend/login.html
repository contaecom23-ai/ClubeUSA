<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Clube USA</title>
  <style>
    :root { --primary: #1B4FBB; --accent: #F5A623; --bg: #F8F9FA; --text: #212529; --muted: #6C757D; --border: #DEE2E6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--primary); color: #fff; padding: 14px 24px; }
    header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 1.2rem; }
    header a span { color: var(--accent); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 40px 36px; width: 100%; max-width: 400px; }
    h2 { font-size: 1.5rem; margin-bottom: 6px; color: var(--primary); }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; color: var(--text); transition: border-color .15s; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(27,79,187,.12); }
    .btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity .15s; margin-top: 8px; }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg { padding: 12px 14px; border-radius: 6px; font-size: 0.9rem; margin-top: 16px; display: none; }
    .msg.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--muted); }
    .footer-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
    .unconfirmed-note { background: #fff3cd; border: 1px solid #ffd900; border-radius: 6px; padding: 10px 12px; font-size: 0.85rem; color: #856404; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <header><a href="/"><span>Clube</span> USA</a></header>
  <main>
    <div class="card">
      <h2>Entrar</h2>
      <p class="subtitle">Bem-vindo de volta!</p>

      <form id="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="joao@email.com" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button class="btn" type="submit" id="btn-submit">Entrar</button>
        <div class="msg error" id="msg"></div>
        <div class="unconfirmed-note" id="unconfirmed-note">
          Sua conta ainda não foi confirmada. Verifique seu email e clique no link que enviamos.
        </div>
      </form>

      <p class="footer-link">Não tem conta? <a href="/register.html">Criar conta grátis</a></p>
    </div>
  </main>

  <script>
    const API = "/api/v1";

    // Se já autenticado, redirecionar para perfil
    if (localStorage.getItem("clubeusa_token")) {
      window.location.href = "/profile.html";
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-submit");
      const msg = document.getElementById("msg");
      const unconfNote = document.getElementById("unconfirmed-note");

      msg.style.display = "none";
      unconfNote.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showError("Preencha email e senha.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Entrando…";

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("clubeusa_token", data.access_token);
          localStorage.setItem("clubeusa_first_name", data.first_name);

          if (!data.email_confirmed) {
            unconfNote.style.display = "block";
          }

          window.location.href = "/profile.html";
        } else {
          showError(data.detail || "Email ou senha incorretos.");
        }
      } catch (_) {
        showError("Erro de conexão. Verifique sua internet.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });

    function showError(text) {
      const el = document.getElementById("msg");
      el.textContent = text;
      el.style.display = "block";
    }
  </script>
</body>
</html>
