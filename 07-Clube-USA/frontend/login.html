<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Clube USA</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Clube USA</h1>
      <p>A plataforma do imigrante brasileiro</p>
    </div>

    <h2>Entrar na conta</h2>

    <div id="msg" class="msg"></div>

    <form id="form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="btn">Entrar</button>
    </form>

    <div class="footer-link">
      Não tem conta? <a href="register.html">Criar conta grátis</a>
    </div>
  </div>

  <script>
    const API = (window.CLUBE_USA_API || 'http://localhost:8000');
    const form = document.getElementById('form');
    const btn  = document.getElementById('btn');
    const msg  = document.getElementById('msg');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg show ' + type;
    }

    // Redireciona se já logado
    if (localStorage.getItem('cu_access_token')) {
      window.location.href = 'profile.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      msg.className = 'msg';

      const body = {
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('cu_access_token',  data.access_token);
          localStorage.setItem('cu_refresh_token', data.refresh_token);
          window.location.href = 'profile.html';
        } else {
          const detail = data.detail || 'Erro ao entrar.';
          if (res.status === 403) {
            showMsg('Email não confirmado. Verifique sua caixa de entrada.', 'info');
          } else {
            showMsg(detail, 'error');
          }
        }
      } catch {
        showMsg('Erro de conexão. Tente novamente.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
