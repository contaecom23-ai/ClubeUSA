<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Clube USA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #f3f4f6; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 36px 32px;
            width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .logo { font-size: 22px; font-weight: 800; color: #1a56db; text-align: center;
            margin-bottom: 4px; }
    .tagline { text-align: center; color: #6b7280; font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 4px; }
    input { width: 100%; padding: 10px 12px; border: 1.5px solid #d1d5db;
            border-radius: 8px; font-size: 15px; outline: none; transition: border-color .15s; }
    input:focus { border-color: #1a56db; }
    .field { margin-bottom: 16px; }
    .btn { width: 100%; padding: 12px; background: #1a56db; color: #fff;
           border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
           cursor: pointer; margin-top: 8px; transition: background .15s; }
    .btn:hover { background: #1648c8; }
    .btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .msg { text-align: center; padding: 12px; border-radius: 8px;
           font-size: 14px; margin-top: 16px; display: none; }
    .msg.success { background: #d1fae5; color: #065f46; }
    .msg.error   { background: #fee2e2; color: #991b1b; }
    .msg.warn    { background: #fef3c7; color: #92400e; }
    .link { text-align: center; margin-top: 20px; font-size: 14px; color: #6b7280; }
    .link a { color: #1a56db; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Clube USA</div>
  <div class="tagline">Para imigrantes brasileiros nos EUA</div>

  <form id="form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="joao@email.com" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Sua senha" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="btn">Entrar</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="link" id="resend-block" style="display:none">
    Não recebeu o email? <a href="#" id="resend-link">Reenviar confirmação</a>
  </div>
  <div class="link">Não tem conta? <a href="register.html">Criar conta grátis</a></div>
</div>

<script>
  const API = (window.CLUBE_USA_API || 'http://localhost:8000');
  let lastEmail = '';

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    msg.style.display = 'none';
    document.getElementById('resend-block').style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    lastEmail = email;

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('clube_usa_token', data.access_token);
        localStorage.setItem('clube_usa_user', JSON.stringify(data.user));
        window.location.href = 'profile.html';
      } else {
        msg.className = 'msg error';
        msg.textContent = data.detail || 'Email ou senha incorretos.';
        // Se email não confirmado, mostrar opção de reenvio
        if (data.detail && data.detail.toLowerCase().includes('confirma')) {
          document.getElementById('resend-block').style.display = 'block';
        }
      }
    } catch {
      msg.className = 'msg error';
      msg.textContent = 'Erro de conexão. Tente novamente.';
    }
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  });

  document.getElementById('resend-link').addEventListener('click', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    try {
      const res = await fetch(`${API}/auth/resend-confirmation?email=${encodeURIComponent(lastEmail)}`, {
        method: 'POST',
      });
      const data = await res.json();
      msg.className = 'msg warn';
      msg.textContent = data.message || 'Link de confirmação enviado!';
      msg.style.display = 'block';
    } catch {
      msg.className = 'msg error';
      msg.textContent = 'Erro ao reenviar. Tente mais tarde.';
      msg.style.display = 'block';
    }
  });
</script>
</body>
</html>
