<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clube USA — Entrar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2rem;
      width: 100%;
      max-width: 380px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; color: #1a202c; }
    .subtitle { color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin-bottom: 0.35rem; }
    input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #4c51bf; }
    .btn {
      width: 100%;
      padding: 0.75rem;
      background: #4c51bf;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #434190; }
    .btn:disabled { background: #a0aec0; cursor: not-allowed; }
    .msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .msg.success { background: #c6f6d5; color: #276749; display: block; }
    .msg.error   { background: #fed7d7; color: #9b2c2c; display: block; }
    .footer-link { text-align: center; margin-top: 1.25rem; font-size: 0.88rem; color: #718096; }
    .footer-link a { color: #4c51bf; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🇧🇷 Clube USA</h1>
    <p class="subtitle">Acesse sua conta</p>

    <form id="form">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="joao@example.com">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input id="password" type="password" required placeholder="Sua senha">
      </div>
      <button class="btn" type="submit" id="btn">Entrar</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="footer-link">
      Não tem conta? <a href="register.html">Cadastre-se grátis</a>
    </div>
  </div>

  <script>
    const API = '';

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      msg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      const body = {
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('refresh_token', data.refresh_token);
          window.location.href = 'profile.html';
        } else {
          msg.className = 'msg error';
          msg.textContent = data.detail || 'Erro ao entrar. Verifique suas credenciais.';
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Erro de conexão. Verifique sua internet.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
