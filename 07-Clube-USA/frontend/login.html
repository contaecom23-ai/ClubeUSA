<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Clube USA</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Clube USA</h1>
      <p>Entre na sua conta</p>
    </div>

    <form id="form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="joao@email.com">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="btn">Entrar</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="links">
      Sem conta? <a href="register.html">Cadastre-se</a>
    </div>
  </div>

  <script>
    const API = (window.CLUBE_API_URL || 'http://localhost:8000');

    // Se já logado, redireciona
    if (localStorage.getItem('clube_token')) {
      window.location.href = 'profile.html';
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      btn.disabled = true;
      btn.textContent = 'Entrando…';

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('clube_token', data.access_token);
          localStorage.setItem('clube_token_expires', data.expires_at);
          localStorage.setItem('clube_email_confirmed', data.email_confirmed);

          if (!data.email_confirmed) {
            msg.className = 'msg success show';
            msg.textContent = 'Login feito! Mas confirme seu email para desbloquear todos os recursos.';
            setTimeout(() => window.location.href = 'profile.html', 2000);
          } else {
            window.location.href = 'profile.html';
          }
        } else {
          msg.className = 'msg error show';
          msg.textContent = data.detail || 'Email ou senha incorretos';
        }
      } catch {
        msg.className = 'msg error show';
        msg.textContent = 'Erro de conexão.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
