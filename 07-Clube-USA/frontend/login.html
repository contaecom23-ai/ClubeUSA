<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Clube USA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff; border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.5rem 2rem; width: 100%; max-width: 420px;
    }
    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo span { font-size: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 700; text-align: center; color: #1a202c; margin-bottom: 0.25rem; }
    .subtitle { text-align: center; color: #718096; font-size: .875rem; margin-bottom: 2rem; }
    label { display: block; font-size: .875rem; font-weight: 600; color: #4a5568; margin-bottom: .35rem; }
    input {
      width: 100%; padding: .75rem 1rem;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 1rem; color: #1a202c;
      transition: border-color .15s; margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    button[type=submit] {
      width: 100%; padding: .875rem;
      background: #3b82f6; color: #fff;
      font-size: 1rem; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer;
      transition: background .15s; margin-top: .5rem;
    }
    button[type=submit]:hover { background: #2563eb; }
    button[type=submit]:disabled { background: #93c5fd; cursor: not-allowed; }
    .alert {
      padding: .875rem 1rem; border-radius: 8px;
      font-size: .875rem; margin-bottom: 1rem; display: none;
    }
    .alert.error-box { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .footer-link { text-align: center; margin-top: 1.5rem; font-size: .875rem; color: #718096; }
    .footer-link a { color: #3b82f6; text-decoration: none; font-weight: 600; }
    .footer-link a:hover { text-decoration: underline; }
    .email-warning {
      background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px;
      padding: .75rem 1rem; font-size: .83rem; color: #92400e;
      margin-bottom: 1rem; display: none;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo"><span>🇺🇸</span></div>
  <h1>Bem-vindo de volta</h1>
  <p class="subtitle">Entre na sua conta Clube USA</p>

  <div class="email-warning" id="emailWarning">
    ⚠️ Seu email ainda não foi confirmado. Verifique sua caixa de entrada.
  </div>
  <div class="alert error-box" id="msgError"></div>

  <form id="loginForm" novalidate>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>

    <label for="password">Senha</label>
    <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password" required>

    <button type="submit" id="submitBtn">Entrar</button>
  </form>

  <div class="footer-link">
    Não tem conta? <a href="register.html">Cadastre-se</a>
  </div>
</div>

<script>
  const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:8000'
    : '';

  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    const el = document.getElementById('msgError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('msgError').style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    document.getElementById('emailWarning').style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';

    const payload = {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    };

    try {
      const res = await fetch(`${API_BASE}/api/v1/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await res.json();

      if (res.ok) {
        // Tokens armazenados no sessionStorage (tab-scoped)
        // Para sessões persistentes, use localStorage com ciência do risco de XSS
        sessionStorage.setItem('access_token', data.access_token);
        sessionStorage.setItem('refresh_token', data.refresh_token);

        // Verifica se email foi confirmado antes de redirecionar
        const meRes = await fetch(`${API_BASE}/api/v1/auth/me`, {
          headers: { 'Authorization': `Bearer ${data.access_token}` },
        });
        if (meRes.ok) {
          const me = await meRes.json();
          if (!me.email_confirmed) {
            document.getElementById('emailWarning').style.display = 'block';
          } else {
            window.location.href = 'dashboard.html';
          }
        } else {
          window.location.href = 'dashboard.html';
        }
      } else {
        showError(data.detail || 'Erro inesperado. Tente novamente.');
      }
    } catch {
      showError('Não foi possível conectar ao servidor. Tente novamente.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
