<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Clube USA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .logo { font-size: 28px; font-weight: 800; color: #1d4ed8; margin-bottom: 8px; }
    .subtitle { color: #6b7280; margin-bottom: 28px; font-size: 15px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 4px; margin-top: 16px; }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color .2s;
      outline: none;
    }
    input:focus { border-color: #1d4ed8; }
    .btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    .btn:hover { background: #1e40af; }
    .btn:disabled { background: #93c5fd; cursor: default; }
    .msg { margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; }
    .msg.success { background: #dcfce7; color: #166534; display: block; }
    .msg.error   { background: #fee2e2; color: #991b1b; display: block; }
    .msg.warn    { background: #fef9c3; color: #854d0e; display: block; }
    .footer { margin-top: 20px; text-align: center; font-size: 14px; color: #6b7280; }
    .footer a { color: #1d4ed8; text-decoration: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Clube USA</div>
  <p class="subtitle">Acesse sua conta</p>

  <form id="form">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="voce@email.com" required>

    <label for="password">Senha</label>
    <input id="password" type="password" placeholder="sua senha" required>

    <button class="btn" type="submit" id="btn">Entrar</button>
  </form>

  <div class="msg" id="msg"></div>

  <p class="footer" style="margin-top:12px">
    <a href="#" id="resend-link" style="display:none">Reenviar email de confirmação</a>
  </p>
  <p class="footer">Não tem conta? <a href="register.html">Cadastrar</a></p>
</div>

<script>
  const API_BASE = "http://localhost:8000"; // TODO: change in production
  let lastEmail = "";

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");
    msg.className = "msg";
    msg.textContent = "";
    btn.disabled = true;
    btn.textContent = "Entrando…";

    lastEmail = document.getElementById("email").value.trim();
    const payload = {
      email:    lastEmail,
      password: document.getElementById("password").value,
    };

    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (res.ok) {
        localStorage.setItem("access_token", data.access_token);
        localStorage.setItem("user_id", data.user_id);

        if (!data.email_confirmed) {
          msg.className = "msg warn";
          msg.textContent = "Login realizado, mas seu email ainda não foi confirmado. Verifique sua caixa de entrada.";
          document.getElementById("resend-link").style.display = "inline";
        } else {
          window.location.href = "profile.html";
        }
      } else {
        const detail = Array.isArray(data.detail)
          ? data.detail.map(d => d.msg).join("; ")
          : (data.detail || "Erro inesperado");
        msg.className = "msg error";
        msg.textContent = detail;
      }
    } catch {
      msg.className = "msg error";
      msg.textContent = "Erro de conexão. Tente novamente.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  });

  document.getElementById("resend-link").addEventListener("click", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    try {
      const res = await fetch(`${API_BASE}/auth/resend-confirmation`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: lastEmail }),
      });
      const data = await res.json();
      msg.className = "msg success";
      msg.textContent = data.message;
    } catch {
      msg.className = "msg error";
      msg.textContent = "Erro ao reenviar. Tente novamente.";
    }
  });
</script>
</body>
</html>
