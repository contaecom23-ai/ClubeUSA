<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Clube USA</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1><a href="/" style="color:inherit;text-decoration:none;">🇺🇸 Clube USA</a></h1>
      <p>Crie sua conta gratuita</p>
    </div>

    <div class="card">
      <div id="alert" class="alert"></div>

      <form id="form" novalidate>
        <div class="form-group">
          <label for="name">Nome completo</label>
          <input id="name" type="text" placeholder="Seu nome" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Senha <span class="optional">(mínimo 8 caracteres)</span></label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" required>
        </div>

        <div class="form-group">
          <label for="estado">Estado americano <span class="optional">(opcional)</span></label>
          <select id="estado">
            <option value="">Selecione…</option>
            <option>AL</option><option>AK</option><option>AZ</option><option>AR</option>
            <option>CA</option><option>CO</option><option>CT</option><option>DC</option>
            <option>DE</option><option>FL</option><option>GA</option><option>HI</option>
            <option>ID</option><option>IL</option><option>IN</option><option>IA</option>
            <option>KS</option><option>KY</option><option>LA</option><option>ME</option>
            <option>MD</option><option>MA</option><option>MI</option><option>MN</option>
            <option>MS</option><option>MO</option><option>MT</option><option>NE</option>
            <option>NV</option><option>NH</option><option>NJ</option><option>NM</option>
            <option>NY</option><option>NC</option><option>ND</option><option>OH</option>
            <option>OK</option><option>OR</option><option>PA</option><option>RI</option>
            <option>SC</option><option>SD</option><option>TN</option><option>TX</option>
            <option>UT</option><option>VT</option><option>VA</option><option>WA</option>
            <option>WV</option><option>WI</option><option>WY</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cidade">Cidade <span class="optional">(opcional)</span></label>
          <input id="cidade" type="text" placeholder="Ex: Orlando">
        </div>

        <div class="form-group">
          <label for="whatsapp">WhatsApp <span class="optional">(opcional)</span></label>
          <input id="whatsapp" type="tel" placeholder="+1 (305) 000-0000" autocomplete="tel">
        </div>

        <button type="submit" class="btn btn-primary" id="btn">Criar conta</button>
      </form>
    </div>

    <p class="footer-text">
      Já tem conta? <a href="/login.html">Fazer login</a>
    </p>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    const form   = document.getElementById("form");
    const alertEl = document.getElementById("alert");
    const btn    = document.getElementById("btn");

    function showAlert(msg, type) {
      alertEl.textContent = msg;
      alertEl.className   = `alert alert-${type} show`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertEl.className = "alert";
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Criando conta…';

      const body = {
        name:     document.getElementById("name").value.trim(),
        email:    document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        estado:   document.getElementById("estado").value || null,
        cidade:   document.getElementById("cidade").value.trim() || null,
        whatsapp: document.getElementById("whatsapp").value.trim() || null,
      };

      try {
        const resp = await api.register(body);
        if (resp.ok) {
          showAlert("✅ Cadastro realizado! Verifique seu email para ativar a conta.", "success");
          form.reset();
        } else if (resp.status === 409) {
          showAlert("Este email já está cadastrado. Tente fazer login.", "error");
        } else {
          showAlert(await apiError(resp), "error");
        }
      } catch {
        showAlert("Erro de conexão. Tente novamente.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Criar conta";
      }
    });
  </script>
</body>
</html>
