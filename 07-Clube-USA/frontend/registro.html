<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Clube USA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="card">
  <div class="logo">🇺🇸 Clube USA</div>
  <h1>Criar conta</h1>
  <p class="subtitle">Junte-se à comunidade brasileira nos EUA</p>

  <div class="alert error" id="err"></div>
  <div class="alert success" id="ok"></div>

  <form id="form">
    <div class="form-group">
      <label for="name">Nome completo</label>
      <input type="text" id="name" placeholder="João da Silva" required maxlength="120">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="joao@email.com" required>
    </div>
    <div class="form-group">
      <label for="password">Senha <small style="color:var(--muted)">(mín. 8 chars, 1 número ou símbolo)</small></label>
      <input type="password" id="password" placeholder="••••••••" required minlength="8">
    </div>
    <button class="btn" type="submit" id="btn">Criar conta</button>
  </form>

  <div class="link-row">
    Já tem conta? <a href="login.html">Entrar</a>
  </div>
</div>

<script>
  const API = (window.CLUBE_API_URL || 'http://localhost:8000');

  function show(id, msg) {
    document.querySelectorAll('.alert').forEach(el => el.classList.remove('show'));
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('show');
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.innerHTML = 'Criando conta <span class="spinner"></span>';

    const body = {
      full_name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    };

    try {
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();

      if (!res.ok) {
        show('err', data.detail || 'Erro ao criar conta');
        return;
      }

      // Salva token
      sessionStorage.setItem('token', data.access_token);
      show('ok', 'Conta criada! Verifique seu email para confirmar o cadastro.');
      document.getElementById('form').reset();

      setTimeout(() => { window.location.href = 'perfil.html'; }, 2000);
    } catch (err) {
      show('err', 'Erro de conexão. Tente novamente.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Criar conta';
    }
  });
</script>
</body>
</html>
