name: Tests — Clube USA

# Roda em todo PR contra main e em pushes diretos à main
# que toquem o código da API/testes.
on:
  pull_request:
    branches: [main]
    paths:
      - "07-Clube-USA/clubeusa/**"
  push:
    branches: [main]
    paths:
      - "07-Clube-USA/clubeusa/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-Clube-USA/clubeusa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "07-Clube-USA/clubeusa/requirements.txt"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        env:
          # Valores falsos — os testes mocam o Supabase, nunca chamam a API real
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_SERVICE_KEY: "test-service-role-key"
          JWT_SECRET: "test-secret-at-least-32-chars-long-ok"
          ENCRYPTION_KEY: "test-encryption-key-32-chars-ok!"
          ENVIRONMENT: "test"
        run: python -m pytest tests/ -v --tb=short
