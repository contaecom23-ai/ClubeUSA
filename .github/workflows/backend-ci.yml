name: Backend CI

on:
  pull_request:
    paths:
      - '07-Clube-USA/backend/**'
  push:
    branches:
      - main
    paths:
      - '07-Clube-USA/backend/**'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-Clube-USA/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: clubeusa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '07-Clube-USA/backend/requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key-not-for-production-use-only
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/clubeusa_test
          TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/clubeusa_test
          ENVIRONMENT: development
          ALLOWED_ORIGINS: http://localhost:3000
          APP_URL: http://localhost:8000
        run: pytest tests/ -v --tb=short
