name: CI

on:
  pull_request:
    paths:
      - "07-Clube-USA/backend/**"
  push:
    branches: [main]
    paths:
      - "07-Clube-USA/backend/**"

jobs:
  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-Clube-USA/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 07-Clube-USA/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SUPABASE_URL: https://fake.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: fake-service-role-key
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          ENVIRONMENT: development
          APP_BASE_URL: http://localhost:8000
          CORS_ORIGINS: http://localhost:3000
        run: pytest tests/ -v --tb=short
